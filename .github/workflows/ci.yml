name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install bats-core
        run: |
          git clone --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          test "$(git -C /tmp/bats-core rev-parse HEAD)" = "3bca150ec86275d6d9d5a4fd7d48ab8b6c6f3d87"
          sudo /tmp/bats-core/install.sh /usr/local
          bats --version

      - name: Install shellcheck v0.11.0
        run: |
          case "${{ runner.os }}" in
            Linux) target=linux.x86_64; sha=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 ;;
            macOS) target=darwin.aarch64; sha=56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79 ;;
          esac
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.${target}.tar.xz"
          echo "${sha}  /tmp/shellcheck.tar.xz" | shasum -a 256 -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo cp /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: Install macOS bash
        if: runner.os == 'macOS'
        run: |
          brew install bash
          bash --version

      - name: Run test suite
        run: bats tests/*.bats

      - name: Verify npm package
        run: |
          node --version
          npm --version
          pack_json="$(npm_config_cache="$RUNNER_TEMP/npm-cache" npm pack --dry-run --json)"
          echo "$pack_json" | jq -r '.[0] | "tarball: \(.filename)\nfiles: \(.entryCount)\nunpacked size: \(.unpackedSize) bytes"'

      - name: Run shellcheck
        run: shellcheck lib/*.sh install.sh update.sh uninstall.sh scripts/*.sh blueprint/.repomethod/scripts/*.sh blueprint/.repomethod/skills/*/scripts/*.sh
