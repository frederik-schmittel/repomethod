name: CI

# Serial timing baseline for local comparison: npm run test:timed -- test-results

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-smoke:
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install bats-core
        run: |
          git clone --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          test "$(git -C /tmp/bats-core rev-parse HEAD)" = "3bca150ec86275d6d9d5a4fd7d48ab8b6c6f3d87"
          sudo /tmp/bats-core/install.sh /usr/local
          bats --version

      - name: Install macOS bash
        if: runner.os == 'macOS'
        run: |
          brew install bash
          bash --version

      - name: Run PR smoke suite
        run: bash scripts/ci-tests.sh smoke test-results

      - name: Upload smoke timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-smoke-${{ runner.os }}
          path: test-results/
          if-no-files-found: error

  full-suite:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [0, 1]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install bats-core
        run: |
          git clone --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          test "$(git -C /tmp/bats-core rev-parse HEAD)" = "3bca150ec86275d6d9d5a4fd7d48ab8b6c6f3d87"
          sudo /tmp/bats-core/install.sh /usr/local
          bats --version

      - name: Install macOS bash
        if: runner.os == 'macOS'
        run: |
          brew install bash
          bash --version

      - name: Run full-suite shard
        run: bash scripts/ci-tests.sh shard test-results "${{ matrix.shard }}"

      - name: Upload shard timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-${{ runner.os }}-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Restore ShellCheck cache
        id: shellcheck-cache
        uses: actions/cache@v4
        with:
          path: /tmp/shellcheck-v0.11.0
          key: shellcheck-linux-x86_64-v0.11.0-8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

      - name: Install shellcheck v0.11.0
        run: |
          if [ "${{ steps.shellcheck-cache.outputs.cache-hit }}" != "true" ]; then
            curl -fsSL -o /tmp/shellcheck.tar.xz \
              "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz"
            echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | shasum -a 256 -c -
            tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          fi
          sudo cp /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: Run repository quality contract
        run: bash scripts/ci-quality.sh
